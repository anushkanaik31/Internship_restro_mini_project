<div class="text-white">
  <div class="mx-auto p-4">
    <a routerLink="/all-restaurants" class="px-4 py-2 rounded-md border-2 border-transparent bg-yellow-500 text-gray-900 hover:bg-yellow-600 transition duration-300 mb-6 inline-block">
      All Restaurants
    </a>

    <p class="text-2xl font-extrabold text-green-600">All Restaurants</p>

    <div class="flex flex-wrap">
      <app-restaurant-card class="w-full sm:w-1/2 md:w-1/3" *ngFor="let restaurant of restaurants" [restaurant]="restaurant"></app-restaurant-card>
    </div>
  </div>
</div>
